<!DOCTYPE html>  <html lang="ja">  
<head>  
  <meta charset="UTF-8">  
  <title>作業時刻メモ</title>    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">  
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <style>
  
/* 共通ボックス設定 */  
 *, *:before, *:after {  
  box-sizing: border-box;  
}  
  
body {  
  padding: 30px;  
  background: #e8c8fe;  
  font-family: "M PLUS Rounded 1c", sans-serif;  
}  
  
/* ボタン */  
  
.btn {  
  display: inline-flex;  
  align-items: center;  
  gap: 0.5em;  
  padding: 1rem 1.5rem;  
  margin: 0.4rem 0.2rem;
  background-color: #fff;  
  border: 2px solid #823eb2;  
  border-radius: 8px;  
  cursor: pointer;  
  color: #2a1737;  
  font-size: 1rem;  
  font-weight: 700; 
}  

.btn:hover {  
  background-color: #823eb2;  
  color: #fff;  
} 

.btn-wrapper {
  max-width: 500px;
  margin: 5px auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn-row {
  display: flex;
  gap: 8px;
}

.btn-row.bottom .btn {
  background-color: #823eb2;
  border-color: #823eb2;
  color: #fff;
}

    /* リスト */  
#list {  
  list-style: none;  
  padding-left: 0;  
  margin: 20px auto;  
  max-width: 500px;  
  font-size: 1rem;  
}  
  
#list li {  
  display: flex;  
  justify-content: space-between;  
  align-items: center;  
  padding: 0.2em 0.5em;  
  border-left: 15px solid #823eb2;  
  background-color: #fff;  
  margin-bottom: 8px;  
  border-radius: 4px;  
  font-weight: 600;  
}  

.task-name {  
  display: flex;  
  align-items: center;  
  gap: 0.5em;  
}  

  /* 動くバー */
.working {
  position: relative;
  overflow: hidden;
}

.working::before {
  content: "";
  position: absolute;
  top: 0;
  left: -20%;
  width: 20%;
  height: 100%;
  background: #823eb2;
  animation: scan 5s linear infinite;
  will-change: transform;
  border-radius: 4px;  
}

.working::after {
  content: "";
  position: absolute;
  inset: 5px 5px;
  background: #823eb2;
  transform-origin: right center;
  animation: scan 4s linear infinite;
  border-radius: 4px;  
}

@keyframes scan {
  0% {
    transform: translateX(-100%) scaleX(0.5);}

  60% {
    transform: translateX(0) scaleX(0.5);}

  100% {
    transform: translateX(0) scaleX(0);}
}

  </style>  </head>  <body>

<div class="btn-wrapper">
  <div class="btn-row top">
    <button class="btn" onclick="startTask('作業')">作業</button>
  </div>

  <div class="btn-row bottom">
    <button class="btn" onclick="endTask()"><span class="material-symbols-outlined">stop_circle</span>終了</button>
    <button class="btn" onclick="clearAll()"><span class="material-symbols-outlined">delete</span>削除</button>
  </div></div>

  <ul id="list"></ul>    <script>  
    const list = document.getElementById("list");  
    let saved = JSON.parse(localStorage.getItem("times") || "[]");  
    saved.forEach(item => addItem(item.task, item.time));  
  
function addItem(taskName, timeText) {  
  const li = document.createElement("li");  
  
  const nameSpan = document.createElement("span");  
  nameSpan.className = "task-name";  

  nameSpan.appendChild(document.createTextNode(taskName));  
  
  const timeSpan = document.createElement("span");  
  timeSpan.className = "task-time";  
  timeSpan.textContent = timeText;  
  
  li.appendChild(nameSpan);  
  li.appendChild(timeSpan);  
  
  // 新しい項目は上に  
  list.prepend(li);  

// 透明度調整（先頭だけ不透明）
const items = list.querySelectorAll("li");
items.forEach((item, index) => {
  item.style.opacity = index === 0 ? "1" : "0.5";
  });  
  return li;  
}  
  
let currentTask = null;  
let currentData = null;  
  
function startTask(taskName) {  
  if (currentTask) return; // すでに走ってたら何もしない  
  
  const start = new Date();  
  const formatted = `${start.getHours()}:${start.getMinutes().toString().padStart(2,"0")}`;  
  
  const li = addItem(taskName, formatted);  
  
  currentTask = taskName;  
  currentData = { start, li };  
  updateWorkingState();
}  
  
function updateWorkingState() {  
  const items = list.querySelectorAll("li");  items.forEach((item, index) => {
  if (index === 0 && currentData) {
    item.classList.add("working");
    item.style.opacity = "1";
    item.style.marginBottom = "15px";
  } else {
    item.classList.remove("working");
    item.style.opacity = "0.5";
    item.style.marginBottom = "5px";
  }});
}  
  
function endTask() {  
  if (!currentData) return;  
  
  const end = new Date();  
  const diffMs = end - currentData.start;  
  
  const minutes = Math.floor(diffMs / 60000);  
  const seconds = Math.floor((diffMs % 60000) / 1000);  
  
  currentData.li.querySelector(".task-time").textContent =  
    `${minutes}分`;  
  
  currentData.li.classList.remove("working");  
  
  currentTask = null;  
  currentData = null;  
}  
  
function clearAll() {
  saved.length = 0;
  localStorage.removeItem("times");
  list.innerHTML = "";

  currentTask = null;
  currentData = null;
}

  </script>  </body>  
</html>
